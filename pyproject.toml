[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urban-canopy"
version = "0.1.0"
description = "Visible urban tree-canopy coverage from Google Street View imagery."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Juan Oliveira de Carvalho" },
]
dependencies = [
  "joblib>=1.5",
  "numpy>=2.0",
  "opencv-python>=4.10",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "requests>=2.32",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]
dev = [
  "black>=25.0",
  "httpx>=0.27",  # fastapi.testclient
  "pytest>=8.0",
  "ruff>=0.8",
]
ml = [
  "pillow>=10.0",
  "torch",
  "torchvision",
  "transformers>=4.49",
  # No module here imports scipy, so this looks removable and is not:
  # OneFormerForUniversalSegmentation.__init__ unconditionally builds
  # OneFormerHungarianMatcher, whose first statement is
  # requires_backends(self, ["scipy"]). That matcher only matters for training,
  # but it is constructed at load time, so from_pretrained raises without scipy
  # before any inference runs.
  "scipy",
]

[project.urls]
Repository = "https://github.com/juanocv/urban_canopy"

[project.scripts]
tree-ai = "urban_canopy.cli.main:main"
tree-ai-diagnostics = "urban_canopy.diagnostics:main"

[tool.setuptools.packages.find]
include = ["urban_canopy*"]

[tool.pytest.ini_options]
testpaths = ["urban_canopy/tests"]
python_files = ["test_*.py"]
# The default suite must stay offline, CPU-only and free of model downloads.
# Run the excluded checks explicitly with `pytest -m gpu` / `pytest -m network`.
addopts = "-q -m 'not gpu and not network'"
markers = [
  "gpu: requires GPU or heavyweight ML model downloads",
  "network: requires external API access",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["urban_canopy"]

[tool.ruff.lint]
select = ["E9", "F"]
