name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor and ceiling of the supported range (requires-python = ">=3.10"),
        # so the floor is a tested promise rather than a claim.
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install OpenCV system libraries
        # opencv-python links against libGL/libglib, which the runner image
        # does not ship; without these `import cv2` fails at collection time.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,api]"

      - name: compileall
        run: python -m compileall urban_canopy -q

      - name: ruff
        run: python -m ruff check urban_canopy

      - name: black
        run: python -m black --check urban_canopy

      - name: pytest
        # The default suite is offline and CPU-only: pyproject deselects the
        # `gpu` and `network` markers, so no weights are downloaded here.
        run: python -m pytest

      - name: diagnostics
        run: python -m urban_canopy.diagnostics

      - name: Pure adapter imports without ML extras
        run: |
          python -c "import urban_canopy.models.oneformer"
          python -c "import urban_canopy.models.mask2former"
          python -c "import urban_canopy.models.deeplab"
          python -c "import urban_canopy.models.detectron2"

      - name: Wheel excludes the test suite
        run: |
          python -m pip install build
          python -m build --wheel
          python -c "import glob, zipfile; p=glob.glob('dist/*.whl')[0]; names=zipfile.ZipFile(p).namelist(); assert not any('/tests/' in n for n in names), names"

  ml-import-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install OpenCV system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install package with ML dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[ml]"

      - name: Import ML adapters
        run: |
          python -c "import torch, torchvision, transformers, PIL"
          python -c "import urban_canopy.models.oneformer"
          python -c "import urban_canopy.models.mask2former"
          python -c "import urban_canopy.models.deeplab"
