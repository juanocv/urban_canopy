name: dependency compatibility

on:
  schedule:
    # Weekly: catches lower-bound rot and upstream releases without delaying PRs.
    - cron: "17 8 * * 1"
  workflow_dispatch:

concurrency:
  group: dependency-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-range:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - resolution: minimum
            python-version: "3.10"
          - resolution: latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/min-ci.txt

      - name: Install OpenCV system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install minimum supported dependencies
        if: matrix.resolution == 'minimum'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements/min-ci.txt -e ".[dev,api]"

      - name: Install latest compatible dependencies
        if: matrix.resolution == 'latest'
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade --upgrade-strategy eager -e ".[dev,api]"

      - name: Run quality gates
        run: bash scripts/check.sh
